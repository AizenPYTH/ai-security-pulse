<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Copilotes de code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="150" y="140" width="900" height="380" rx="20" fill="#0B1220"/>
  <circle cx="180" cy="170" r="6" fill="#F87171"/>
  <circle cx="202" cy="170" r="6" fill="#FBBF24"/>
  <circle cx="224" cy="170" r="6" fill="#34D399"/>
  <text x="190" y="230" font-family="ui-monospace,monospace" font-size="22" fill="#93C5FD">function securePrompt(input) {</text>
  <text x="210" y="270" font-family="ui-monospace,monospace" font-size="22" fill="#E5E7EB">const score = detect(input);</text>
  <text x="210" y="310" font-family="ui-monospace,monospace" font-size="22" fill="#86EFAC">if (score &gt; 0.8) return block();</text>
  <text x="210" y="350" font-family="ui-monospace,monospace" font-size="22" fill="#E5E7EB">return allow(input);</text>
  <text x="190" y="390" font-family="ui-monospace,monospace" font-size="22" fill="#93C5FD">}</text>
  <rect x="720" y="220" width="280" height="160" rx="16" fill="#1E293B" stroke="#3B82F6"/>
  <text x="750" y="270" font-family="system-ui,sans-serif" font-size="18" fill="#93C5FD">Copilote</text>
  <text x="750" y="310" font-family="system-ui,sans-serif" font-size="16" fill="#E5E7EB">Suggestion prête</text>
  <text x="750" y="350" font-family="system-ui,sans-serif" font-size="16" fill="#60A5FA">Revue humaine ’</text>
  <text x="150" y="110" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#111">Copilotes de code</text>
</svg>
